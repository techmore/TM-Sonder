name: CI

on:
  push:
    # Every branch, not a hand-maintained list. The list was [main, master,
    # go-port, fix/**, codex/**], so work on dev-container -- where the container
    # machine and the audiobooks work actually lived -- never ran CI at all.
    # A green main said nothing about whether those branches were buildable.
    branches: ["**"]
  pull_request:

jobs:
  sonder-api:
    name: SonderAPI package
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test SonderAPI
        run: |
          cd Packages/SonderAPI
          swift test

  mac-app:
    name: macOS Release build
    # macos-15 ships at most Xcode 26.x, while this project is developed on
    # 27.0. Pinning the toolchain is only meaningful if the image can actually
    # provide it, so the image is the newer one.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        # Pinned, not "whatever is newest". `xcode-select -s
        # /Applications/Xcode.app` with a beta fallback meant the toolchain
        # changed under the project: a commit could build on a developer Mac and
        # fail here purely because the image shipped a different SDK.
        #
        # 26.6.0 is the newest Xcode on any GitHub-hosted image, and is not the
        # 27.0 this project is developed on. That gap is real and is documented
        # in docs/ci-toolchain-gap.md: the 27.0 SDK does not annotate AppKit the
        # way 26.x does, so the same source builds on one and not the other.
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6.0"
      - name: Report the toolchain
        # A concurrency failure is close to unreadable without knowing which
        # compiler produced it, so the version is part of the log rather than
        # something to infer later.
        run: |
          xcodebuild -version
          swift --version
      - name: Build Mac host
        run: |
          # SWIFT_VERSION=6 is pinned deliberately. Without it this job passed
          # or failed depending on the runner image's default language mode,
          # which is how the same commit built on a developer Mac and failed
          # here. Pinning it means the strict concurrency checking is the thing
          # being tested, rather than whatever the image happens to default to.
          xcodebuild build \
            -project xcode-TM-Sonder.xcodeproj \
            -scheme xcode-TM-Sonder \
            -configuration Release \
            -destination 'platform=macOS' \
            SWIFT_VERSION=6 \
            CODE_SIGNING_ALLOWED=NO
      - name: Test shared API package
        run: swift test --package-path Packages/SonderAPI

  go-server:
    name: Go server (fmt + vet + test + cross-compile)
    runs-on: macos-15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Format check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"; exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test (race)
        run: go test -race -count=1 ./...
      - name: Cross-compile artifacts
        run: |
          VERSION="${GITHUB_SHA::12}"
          LDFLAGS="-s -w -X main.version=${VERSION}"
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags "$LDFLAGS" -o ../bin/sonder-darwin-arm64 ./cmd/sonder
          CGO_ENABLED=0 GOOS=linux  GOARCH=arm64 go build -trimpath -ldflags "$LDFLAGS" -o ../bin/sonder-linux-arm64  ./cmd/sonder
          # linux/amd64 is the deploy target: the server host is x86_64. It was
          # missing here, so the architecture that actually runs in production
          # was the one architecture CI never built.
          CGO_ENABLED=0 GOOS=linux  GOARCH=amd64 go build -trimpath -ldflags "$LDFLAGS" -o ../bin/sonder-linux-amd64  ./cmd/sonder
      - name: Web client tests
        # This job defaults its working directory to server/, so a step that
        # needs a path from the repository root has to say so. Left implicit it
        # looks for server/server/internal/... and fails with "Could not find".
        working-directory: .
        run: node --test server/internal/httpapi/web/library.test.cjs
      - name: Deploy script tests
        # The deploy script is what runs on the server, and it is the one piece
        # of this repo that cannot be exercised by the server's own test suite.
        # Its architecture guard and both rollback paths are driven here against
        # stubs, which is how the same-second backup collision was found.
        working-directory: deploy
        run: go test ./...
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sonder-binaries
          path: bin/

  # NOTE: a job that builds IOS_Client_Xcode is intentionally absent until the
  # iOS project is properly vendored or registered as a submodule. Today it is
  # committed as a bare gitlink with no .gitmodules entry, so a fresh checkout
  # contains no iOS sources to build.

name: CI

on:
  push:
    # Every branch, not a hand-maintained list. The list was [main, master,
    # go-port, fix/**, codex/**], so work on dev-container -- where the container
    # machine and the audiobooks work actually lived -- never ran CI at all.
    # A green main said nothing about whether those branches were buildable.
    branches: ["**"]
  pull_request:

jobs:
  sonder-api:
    name: SonderAPI package
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test SonderAPI
        run: |
          cd Packages/SonderAPI
          swift test

  mac-app:
    name: macOS Release build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app || sudo xcode-select -s /Applications/Xcode-beta.app
      - name: Build Mac host
        run: |
          xcodebuild build \
            -project xcode-TM-Sonder.xcodeproj \
            -scheme xcode-TM-Sonder \
            -configuration Release \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO
      - name: Test shared API package
        run: swift test --package-path Packages/SonderAPI

  go-server:
    name: Go server (fmt + vet + test + cross-compile)
    runs-on: macos-15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Format check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"; exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test (race)
        run: go test -race -count=1 ./...
      - name: Cross-compile artifacts
        run: |
          VERSION="${GITHUB_SHA::12}"
          LDFLAGS="-s -w -X main.version=${VERSION}"
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags "$LDFLAGS" -o ../bin/sonder-darwin-arm64 ./cmd/sonder
          CGO_ENABLED=0 GOOS=linux  GOARCH=arm64 go build -trimpath -ldflags "$LDFLAGS" -o ../bin/sonder-linux-arm64  ./cmd/sonder
          # linux/amd64 is the deploy target: the server host is x86_64. It was
          # missing here, so the architecture that actually runs in production
          # was the one architecture CI never built.
          CGO_ENABLED=0 GOOS=linux  GOARCH=amd64 go build -trimpath -ldflags "$LDFLAGS" -o ../bin/sonder-linux-amd64  ./cmd/sonder
      - name: Web client tests
        # This job defaults its working directory to server/, so a step that
        # needs a path from the repository root has to say so. Left implicit it
        # looks for server/server/internal/... and fails with "Could not find".
        working-directory: .
        run: node --test server/internal/httpapi/web/library.test.cjs
      - name: Deploy script tests
        # The deploy script is what runs on the server, and it is the one piece
        # of this repo that cannot be exercised by the server's own test suite.
        # Its architecture guard and both rollback paths are driven here against
        # stubs, which is how the same-second backup collision was found.
        working-directory: deploy
        run: go test ./...
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sonder-binaries
          path: bin/

  # NOTE: a job that builds IOS_Client_Xcode is intentionally absent until the
  # iOS project is properly vendored or registered as a submodule. Today it is
  # committed as a bare gitlink with no .gitmodules entry, so a fresh checkout
  # contains no iOS sources to build.

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="application-name" content="TM Sonder">
  <meta name="apple-mobile-web-app-title" content="TM Sonder">
  <title>TM Sonder Ebooks</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="alternate icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/favicon.png">
  <style>
    :root { color-scheme: dark; --bg:#10130f; --panel:#171d15; --panel2:#202819; --line:#344128; --text:#eff4e8; --muted:#a8b39c; --accent:#b6d56d; }
    * { box-sizing:border-box; }
    body { margin:0; font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); }
    header { position:sticky; top:0; z-index:2; display:grid; grid-template-columns:auto minmax(220px, 1fr) auto; gap:12px; align-items:center; padding:16px 20px; background:rgba(16,19,15,.96); border-bottom:1px solid var(--line); }
    h1 { margin:0; font-size:24px; }
    h3 { margin:0; font-size:15px; }
    p { margin:0; color:var(--muted); line-height:1.35; }
    input { width:100%; background:var(--panel); border:1px solid var(--line); color:var(--text); border-radius:8px; padding:10px 12px; }
    a.button, button.button { background:var(--panel2); border:1px solid var(--line); color:var(--text); border-radius:8px; padding:8px 10px; text-decoration:none; cursor:pointer; font:inherit; }
    main { display:grid; grid-template-columns:minmax(280px, 420px) minmax(0, 1fr); min-height:calc(100vh - 65px); }
    aside { border-right:1px solid var(--line); background:#12170f; overflow:auto; }
    .listHeader { display:flex; justify-content:space-between; align-items:center; padding:14px 16px; border-bottom:1px solid var(--line); }
    .book { display:grid; grid-template-columns:56px minmax(0,1fr); gap:12px; width:100%; padding:13px 16px; border:0; border-bottom:1px solid rgba(52,65,40,.65); background:transparent; color:var(--text); text-align:left; cursor:pointer; }
    .book:hover, .book.selected { background:var(--panel); }
    .cover { width:56px; aspect-ratio:2/3; display:grid; place-items:center; border-radius:6px; overflow:hidden; background:linear-gradient(145deg,#334124,#11160f); color:var(--accent); font-weight:800; }
    .cover img { width:100%; height:100%; object-fit:cover; }
    .meta { display:flex; flex-wrap:wrap; gap:6px; margin-top:7px; color:var(--muted); font-size:12px; }
    .pill { color:#11160f; background:var(--accent); border-radius:4px; padding:2px 6px; font-size:11px; font-weight:700; }
    .detail { padding:22px; overflow:auto; }
    .hero { display:grid; grid-template-columns:150px minmax(0,1fr); gap:20px; align-items:start; margin-bottom:20px; }
    .hero .cover { width:150px; }
    .actions { display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; }
    .empty { padding:30px; color:var(--muted); }
    button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
    .load-error { display:grid; gap:10px; justify-items:start; padding:22px 16px; color:var(--muted); }
    .load-error strong { color:var(--text); }
    .load-error button { font:inherit; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition:none !important; animation:none !important; scroll-behavior:auto !important; } }
    @media (max-width: 820px) {
      header { grid-template-columns:1fr; }
      main { grid-template-columns:1fr; }
      aside { max-height:45vh; border-right:0; border-bottom:1px solid var(--line); }
      .hero { grid-template-columns:96px minmax(0,1fr); }
      .hero .cover { width:96px; }
    }
  </style>
  <script src="/shared.js"></script>
  <script src="/project-analytics.js" defer></script>
</head>
<body>
  <header>
    <h1>Ebooks</h1>
    <input id="q" type="search" placeholder="Search title or author" aria-label="Search ebooks by title or author" autocomplete="off">
    <a class="button" id="libraryLink" href="/">Library</a>
  </header>
  <main>
    <aside>
      <div class="listHeader"><strong id="count" role="status">0 titles</strong><span class="time" id="updated"></span></div>
      <div id="results" class="empty" aria-live="polite" aria-busy="true">Loading ebooks…</div>
    </aside>
    <section class="detail" id="detail"><p>Select an ebook.</p></section>
  </main>
  <script>
    let books = [];
    let selectedID = null;
    const q = document.querySelector("#q");
    const results = document.querySelector("#results");
    const detail = document.querySelector("#detail");
    const count = document.querySelector("#count");
    const updated = document.querySelector("#updated");

    const { api, escapeHTML } = window.Sonder;
    document.querySelector("#libraryLink").href = api("/");

    async function loadBooks() {
      results.setAttribute("aria-busy", "true");
      try {
        const response = await fetch(api(`/api/ebooks?q=${encodeURIComponent(q.value)}`));
        if (!response.ok) throw Object.assign(new Error(`Request failed (${response.status})`), { status: response.status });
        const data = await response.json();
        books = data.items ?? [];
        count.textContent = `${data.count ?? books.length} title${(data.count ?? books.length) === 1 ? "" : "s"}`;
        updated.textContent = data.generatedAt ? new Date(data.generatedAt).toLocaleTimeString([], { hour:"numeric", minute:"2-digit" }) : "";
        renderList();
        if (!selectedID && books.length > 0) openBook(books[0].id);
      } catch (error) {
        renderLoadError(error);
      } finally {
        results.removeAttribute("aria-busy");
      }
    }

    // A failed catalog request used to leave "Loading ebooks…" on screen
    // forever. Name the failure and offer a retry; an expired browser session
    // gets a sign-in link instead of a retry that cannot succeed.
    function renderLoadError(error) {
      const status = Number(error?.status) || 0;
      const auth = status === 401 || status === 403;
      count.textContent = "—";
      results.className = "";
      const next = encodeURIComponent(location.pathname + location.search);
      results.innerHTML = `<div class="load-error" role="alert"><strong>${auth ? "Sign in to browse ebooks" : "Could not load ebooks"}</strong><span>${escapeHTML(auth ? "Your session has ended or this library needs an account." : status ? `The server answered with status ${status}.` : "The server could not be reached.")}</span>${auth ? `<a class="button" href="/account/login?next=${next}">Sign in</a>` : `<button type="button" class="button" onclick="loadBooks()">Try again</button>`}</div>`;
    }

    function renderList() {
      if (books.length === 0) {
        results.className = "empty";
        results.textContent = "No ebooks found.";
        return;
      }
      results.className = "";
      results.innerHTML = books.map(book => `
        <button type="button" class="book ${book.id === selectedID ? "selected" : ""}" aria-pressed="${book.id === selectedID}" data-id="${escapeHTML(book.id)}" onclick="openBook(this.dataset.id)">
          <div class="cover">${book.posterURL ? `<img src="${api(book.posterURL)}" alt="">` : "B"}</div>
          <div>
            <h3>${escapeHTML(book.title)}</h3>
            <p>${escapeHTML([book.author, book.series].filter(Boolean).join(" • ") || book.subtitle)}</p>
            <div class="meta"><span>${escapeHTML((book.tags ?? []).includes("pdf") ? "PDF" : "EPUB")}</span>${book.year ? `<span>${book.year}</span>` : ""}</div>
          </div>
        </button>`).join("");
    }

    function openBook(id) {
      selectedID = id;
      renderList();
      const book = books.find(b => b.id === id);
      if (!book) return;
      renderDetail(book);
    }

    function renderDetail(book) {
      detail.innerHTML = `
        <div class="hero">
          <div class="cover">${book.posterURL ? `<img src="${api(book.posterURL)}" alt="">` : "B"}</div>
          <div>
            <span class="pill">Ebook</span>
            <h1 style="margin:8px 0;">${escapeHTML(book.title)}</h1>
            <p>${escapeHTML([book.author, book.series].filter(Boolean).join(" • "))}</p>
            ${book.summary ? `<p style="margin-top:12px; max-width:60ch;">${escapeHTML(book.summary)}</p>` : ""}
            <div class="actions">
              <a class="button" href="${api("/read/" + encodeURIComponent(book.id) + "?title=" + encodeURIComponent(book.title || "Ebook"))}">Read in browser</a>
              <a class="button" href="${api("/stream/" + encodeURIComponent(book.id))}" download>Download EPUB</a>
            </div>
          </div>
        </div>`;
    }

    let debounce = null;
    q.addEventListener("input", () => {
      clearTimeout(debounce);
      debounce = setTimeout(loadBooks, 180);
    });
    loadBooks();
  </script>
</body>
</html>

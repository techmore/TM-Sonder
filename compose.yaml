services:
  tm-sonder:
    build:
      context: .
      dockerfile: deploy/Containerfile
    image: tm-sonder:local
    container_name: tm-sonder
    labels:
      org.opencontainers.image.title: TM-Sonder
      app.kubernetes.io/name: tm-sonder
    ports:
      - "8797:8797"
    environment:
      SONDER_DATA_DIR: /data
    volumes:
      - ${SONDER_MEDIA_DIR:-./media}:/media:ro
      - ${SONDER_DATA_VOLUME:-sonder-data}:/data
    restart: unless-stopped

volumes:
  sonder-data:
